<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#11141b"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0%" stop-color="#7cf2c8"/>
      <stop offset="100%" stop-color="#9aa6ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- browser chrome -->
  <rect x="40" y="40" width="720" height="420" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="64" cy="64" r="6" fill="#ff5f57" opacity=".7"/>
  <circle cx="84" cy="64" r="6" fill="#febc2e" opacity=".7"/>
  <circle cx="104" cy="64" r="6" fill="#28c840" opacity=".7"/>
  <rect x="140" y="52" width="540" height="22" rx="11" fill="#ffffff" fill-opacity=".05"/>
  <text x="410" y="68" fill="#fff" font-family="JetBrains Mono, monospace" font-size="10" opacity=".55" text-anchor="middle">cliente-local.com.ar</text>

  <!-- nav -->
  <text x="64" y="118" fill="#fff" font-family="Inter" font-size="13" font-weight="700">Atelier</text>
  <g font-family="Inter" font-size="11" fill="#fff" opacity=".55">
    <text x="540" y="118">Productos</text>
    <text x="610" y="118">Nosotros</text>
    <text x="680" y="118">Contacto</text>
  </g>

  <!-- hero -->
  <text x="64" y="200" fill="#fff" font-family="Inter" font-size="38" font-weight="700">Indumentaria</text>
  <text x="64" y="240" fill="url(#hero)" font-family="Inter" font-size="38" font-weight="700">hecha en Luján.</text>
  <text x="64" y="280" fill="#fff" opacity=".55" font-family="Inter" font-size="13">Diseños únicos, producción local. Envíos a todo el país.</text>

  <rect x="64" y="304" width="150" height="40" rx="20" fill="#7cf2c8"/>
  <text x="139" y="329" fill="#0b0d12" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Ver catálogo</text>

  <rect x="226" y="304" width="150" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
  <text x="301" y="329" fill="#fff" font-family="Inter" font-size="12" text-anchor="middle">WhatsApp →</text>

  <!-- product cards -->
  <g>
    <rect x="500" y="140" width="100" height="120" rx="10" fill="#ffffff" fill-opacity=".05"/>
    <rect x="608" y="140" width="100" height="120" rx="10" fill="#ffffff" fill-opacity=".05"/>
    <rect x="500" y="270" width="100" height="120" rx="10" fill="#ffffff" fill-opacity=".05"/>
    <rect x="608" y="270" width="100" height="120" rx="10" fill="#ffffff" fill-opacity=".05"/>
  </g>

  <!-- footer line -->
  <rect x="64" y="420" width="660" height="1" fill="#ffffff" fill-opacity=".1"/>
  <text x="64" y="442" fill="#fff" opacity=".4" font-family="Inter" font-size="10">© 2026 · responsive · WhatsApp Business · carrito de compras</text>
</svg>
