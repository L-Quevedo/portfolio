<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#11141b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" x2="1">
      <stop offset="0%" stop-color="#7cf2c8"/>
      <stop offset="100%" stop-color="#9aa6ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- header bar -->
  <rect x="40" y="40" width="720" height="56" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="68" cy="68" r="10" fill="url(#acc)"/>
  <text x="90" y="73" fill="#fff" font-family="Inter" font-size="14" font-weight="600">PrecioYa</text>
  <text x="170" y="73" fill="#fff" font-family="Inter" font-size="12" opacity=".5">/api/v1/products?q=leche</text>
  <rect x="600" y="56" width="140" height="24" rx="12" fill="#7cf2c8" fill-opacity=".12" stroke="#7cf2c8" stroke-opacity=".4"/>
  <text x="616" y="73" fill="#7cf2c8" font-family="JetBrains Mono, monospace" font-size="11">200 OK · 142ms</text>

  <!-- search results card -->
  <g font-family="Inter" font-size="13">
    <rect x="40" y="120" width="720" height="64" rx="12" fill="#ffffff" fill-opacity=".03"/>
    <text x="60" y="148" fill="#fff" font-weight="600">Leche La Serenísima 1L</text>
    <text x="60" y="168" fill="#fff" opacity=".55" font-size="11">Carrefour · Coto · Dia · Jumbo · La Anónima</text>
    <text x="700" y="158" fill="#7cf2c8" font-size="16" font-weight="700" text-anchor="end">$ 1.240</text>

    <rect x="40" y="196" width="720" height="64" rx="12" fill="#ffffff" fill-opacity=".03"/>
    <text x="60" y="224" fill="#fff" font-weight="600">Yerba mate Playadito 1Kg</text>
    <text x="60" y="244" fill="#fff" opacity=".55" font-size="11">Carrefour · Coto · Dia · Jumbo</text>
    <text x="700" y="234" fill="#7cf2c8" font-size="16" font-weight="700" text-anchor="end">$ 3.890</text>

    <rect x="40" y="272" width="720" height="64" rx="12" fill="#ffffff" fill-opacity=".03"/>
    <text x="60" y="300" fill="#fff" font-weight="600">Aceite Natura girasol 1.5L</text>
    <text x="60" y="320" fill="#fff" opacity=".55" font-size="11">Coto · Dia · Jumbo · La Anónima</text>
    <text x="700" y="310" fill="#7cf2c8" font-size="16" font-weight="700" text-anchor="end">$ 2.150</text>
  </g>

  <!-- architecture pipeline -->
  <g transform="translate(40,370)">
    <rect width="720" height="90" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="#fff" opacity=".75">
      <text x="24" y="34" fill="#7cf2c8">SEPA</text>
      <text x="24" y="52">datos abiertos</text>
    </g>
    <text x="120" y="50" font-family="JetBrains Mono" font-size="14" fill="#9aa6ff">→</text>
    <g transform="translate(150,20)">
      <rect width="120" height="50" rx="10" fill="#9aa6ff" fill-opacity=".08"/>
      <text x="60" y="22" font-family="JetBrains Mono" font-size="11" fill="#9aa6ff" text-anchor="middle">pandas</text>
      <text x="60" y="38" font-family="JetBrains Mono" font-size="10" fill="#fff" opacity=".55" text-anchor="middle">ETL · normalize</text>
    </g>
    <text x="290" y="50" font-family="JetBrains Mono" font-size="14" fill="#9aa6ff">→</text>
    <g transform="translate(320,20)">
      <rect width="120" height="50" rx="10" fill="#7cf2c8" fill-opacity=".08"/>
      <text x="60" y="22" font-family="JetBrains Mono" font-size="11" fill="#7cf2c8" text-anchor="middle">MySQL</text>
      <text x="60" y="38" font-family="JetBrains Mono" font-size="10" fill="#fff" opacity=".55" text-anchor="middle">products · prices</text>
    </g>
    <text x="460" y="50" font-family="JetBrains Mono" font-size="14" fill="#9aa6ff">→</text>
    <g transform="translate(490,20)">
      <rect width="120" height="50" rx="10" fill="#ff9ae0" fill-opacity=".08"/>
      <text x="60" y="22" font-family="JetBrains Mono" font-size="11" fill="#ff9ae0" text-anchor="middle">FastAPI</text>
      <text x="60" y="38" font-family="JetBrains Mono" font-size="10" fill="#fff" opacity=".55" text-anchor="middle">REST endpoints</text>
    </g>
    <text x="630" y="50" font-family="JetBrains Mono" font-size="14" fill="#9aa6ff">→</text>
    <text x="650" y="34" font-family="JetBrains Mono" font-size="11" fill="#fff" opacity=".75">React</text>
    <text x="650" y="50" font-family="JetBrains Mono" font-size="11" fill="#fff" opacity=".75">Native</text>
  </g>
</svg>
