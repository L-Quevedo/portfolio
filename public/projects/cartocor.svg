<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#11141b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" x2="1">
      <stop offset="0%" stop-color="#7cf2c8"/>
      <stop offset="100%" stop-color="#9aa6ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- KPI cards -->
  <g>
    <rect x="40" y="40" width="220" height="110" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="60" y="80" fill="#fff" font-family="Inter" font-size="10" opacity=".5">RECLAMOS / MES</text>
    <text x="60" y="120" fill="#7cf2c8" font-family="Inter" font-size="34" font-weight="700">−42%</text>

    <rect x="280" y="40" width="220" height="110" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="300" y="80" fill="#fff" font-family="Inter" font-size="10" opacity=".5">NO CONFORMIDADES</text>
    <text x="300" y="120" fill="#fff" font-family="Inter" font-size="34" font-weight="700">28</text>

    <rect x="520" y="40" width="240" height="110" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="540" y="80" fill="#fff" font-family="Inter" font-size="10" opacity=".5">CUMPLIMIENTO ESPECS.</text>
    <text x="540" y="120" fill="#fff" font-family="Inter" font-size="34" font-weight="700">98.2%</text>
  </g>

  <!-- main chart -->
  <rect x="40" y="180" width="460" height="280" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="60" y="208" fill="#fff" font-family="Inter" font-size="11" opacity=".55">RECLAMOS DE CLIENTES — ÚLTIMOS 12 MESES</text>

  <g transform="translate(60,230)">
    <line x1="0" y1="200" x2="420" y2="200" stroke="#ffffff" stroke-opacity=".1"/>
    <line x1="0" y1="140" x2="420" y2="140" stroke="#ffffff" stroke-opacity=".06"/>
    <line x1="0" y1="80" x2="420" y2="80" stroke="#ffffff" stroke-opacity=".06"/>
    <g>
      <rect x="10" width="22" height="160" y="40" rx="3" fill="#fff" fill-opacity=".15"/>
      <rect x="45" width="22" height="150" y="50" rx="3" fill="#fff" fill-opacity=".15"/>
      <rect x="80" width="22" height="170" y="30" rx="3" fill="#fff" fill-opacity=".15"/>
      <rect x="115" width="22" height="155" y="45" rx="3" fill="#fff" fill-opacity=".15"/>
      <rect x="150" width="22" height="140" y="60" rx="3" fill="#fff" fill-opacity=".15"/>
      <rect x="185" width="22" height="120" y="80" rx="3" fill="#fff" fill-opacity=".15"/>
      <rect x="220" width="22" height="100" y="100" rx="3" fill="#7cf2c8" fill-opacity=".4"/>
      <rect x="255" width="22" height="85" y="115" rx="3" fill="#7cf2c8" fill-opacity=".55"/>
      <rect x="290" width="22" height="70" y="130" rx="3" fill="#7cf2c8" fill-opacity=".65"/>
      <rect x="325" width="22" height="60" y="140" rx="3" fill="#7cf2c8" fill-opacity=".75"/>
      <rect x="360" width="22" height="55" y="145" rx="3" fill="#7cf2c8" fill-opacity=".85"/>
      <rect x="395" width="22" height="48" y="152" rx="3" fill="url(#acc)"/>
    </g>
  </g>

  <!-- side panel: top causes -->
  <rect x="520" y="180" width="240" height="280" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="540" y="208" fill="#fff" font-family="Inter" font-size="11" opacity=".55">CAUSAS RAÍZ DETECTADAS</text>

  <g font-family="Inter" font-size="12">
    <text x="540" y="246" fill="#fff" opacity=".8">Calibración equipos</text>
    <rect x="540" y="254" width="200" height="6" rx="3" fill="#fff" fill-opacity=".06"/>
    <rect x="540" y="254" width="160" height="6" rx="3" fill="url(#acc)"/>

    <text x="540" y="290" fill="#fff" opacity=".8">Materia prima</text>
    <rect x="540" y="298" width="200" height="6" rx="3" fill="#fff" fill-opacity=".06"/>
    <rect x="540" y="298" width="120" height="6" rx="3" fill="#9aa6ff"/>

    <text x="540" y="334" fill="#fff" opacity=".8">Manipulación</text>
    <rect x="540" y="342" width="200" height="6" rx="3" fill="#fff" fill-opacity=".06"/>
    <rect x="540" y="342" width="90" height="6" rx="3" fill="#ff9ae0"/>

    <text x="540" y="378" fill="#fff" opacity=".8">Especificación</text>
    <rect x="540" y="386" width="200" height="6" rx="3" fill="#fff" fill-opacity=".06"/>
    <rect x="540" y="386" width="60" height="6" rx="3" fill="#fff" fill-opacity=".4"/>

    <text x="540" y="430" fill="#7cf2c8" font-family="JetBrains Mono, monospace" font-size="11">→ −42% reclamos</text>
  </g>
</svg>
